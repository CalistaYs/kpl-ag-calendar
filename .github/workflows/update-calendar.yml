name: Update KPL AG calendar

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-calendar.yml'
  schedule:
    # 故意不用整点/半点（:00、:30），错开 GitHub Actions 在这两个时间点的排队高峰。
    # smart_update.py 自己决定这次是完整扫描（固定在 UTC 0/6/12/18 点的 :07）、
    # 只刷新临近/进行中比赛的比分（MATCH_REFRESH），还是直接跳过（SKIP）。
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "强制执行完整扫描（忽略当前是否处于固定整点/比赛窗口）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-ag-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Refresh calendar
        env:
          # 手动触发（workflow_dispatch）时按输入的开关决定；定时触发时这个表达式
          # 短路成 false，交给 smart_update.py 自己按时间判断。
          FORCE_FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_refresh }}
        run: python smart_update.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- calendar.ics; then
            echo "calendar.ics is already up to date"
          else
            git add calendar.ics
            git commit -m "Update Chengdu AG calendar"
            git push
          fi

      # 国内镜像供无法稳定访问 GitHub Raw 的日历客户端订阅。
      - name: Sync calendar repository to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN is not configured; skipping Gitee sync"
            exit 0
          fi

          git remote add gitee "https://CalistaYs:${GITEE_TOKEN}@gitee.com/CalistaYs/kpl-ag-calendar.git"
          git push gitee HEAD:main
